name: Daily Garmin Dashboard Refresh

on:
  schedule:
    # Runs every day at 07:00 UTC.
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  refresh-garmin-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r GarminDashboard/requirements.txt
          pip install garminconnect

      - name: Run Garmin export
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: python GarminDashboard/export.py

      - name: Validate Streamlit app script
        run: python -m py_compile GarminDashboard/streamlit_app.py

      - name: Commit updated dashboard artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GarminDashboard/data/dashboard_metrics_history.csv GarminDashboard/data/garmin_dashboard.db
          git commit -m "Daily Garmin refresh $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
